name: Report

# Builds the evaluation report and publishes it to GitHub Pages. Until a real
# log is committed this uses the SYNTHETIC sample, and every view says so.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/make_sample.py --db sample.db
      - run: uv run python scripts/evaluate.py --db sample.db --html docs/report/index.html
      - run: uv run playwright install --with-deps chromium
      - run: uv run python scripts/screenshot.py docs/report/index.html --out docs/screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/screenshots
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/report

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
