name: Report

# Publishes the committed project brief (docs/index.html, built by
# scripts/build_brief.py from results/replay_cycle.json). No contract has
# settled yet, so no evaluation report is published; the brief says so.

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the brief links sources at the commit that last changed them
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Report kit matches its pinned hashes
        run: python report-kit/check_kit.py
      - name: Committed brief matches the committed snapshot
        run: |
          python scripts/build_brief.py
          git diff --exit-code -- docs
      - name: Publish only the brief
        run: mkdir _site && cp docs/index.html _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
